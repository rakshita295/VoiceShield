apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.voiceshield.detector'
version = '1.0.0'

def useExpoModules() {
  def corePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
  if (corePlugin.exists()) {
    apply from: corePlugin
    applyKotlinExpoModulesCorePlugin()
  }
}
useExpoModules()

android {
    namespace "com.voiceshield.detector"
    defaultConfig {
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation project(':expo-modules-core')
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"

    // Microsoft ONNX Runtime Mobile for Android
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.0'
}
